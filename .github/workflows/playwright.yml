name: Sites workability checking with Allure report on GitHub Pages

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:
        inputs:
            grep:
                description: "Grep pattern for Playwright tests"
                required: false
                default: "Проверка доступности сайтов"

jobs:
    check_sites_workability:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.57.0-noble

        env:
            TZ: Europe/Moscow
            PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

        steps:
            - name: Initialize variables
              run: |
                  {
                    echo "job_status=running"
                    echo "job_emoji=⌛"
                    echo "tests_exit_code=0"
                    echo "job_exit_code=0"
                    echo "ALLURE_TOTAL=0"
                    echo "ALLURE_PASSED=0"
                    echo "ALLURE_FAILED=0"
                    echo "ALLURE_BROKEN=0"
                    echo "ALLURE_SKIPPED=0"
                    echo "ALLURE_UNKNOWN=0"
                    echo "REPORT_DATE=$(date +'%Y-%m-%d')"
                    echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)"
                  } >> "$GITHUB_ENV"

            - name: Checkout code and gh-pages
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 1
                  fetch-tags: false
                  filter: blob:none

            - name: Mark repository as safe
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Download Allure history from gh-pages
              if: always()
              run: |
                  git fetch --depth=8 origin gh-pages || exit 0
                  if git show-ref --verify refs/remotes/origin/gh-pages; then
                    git worktree add --force gh-pages origin/gh-pages
                    mkdir -p allure-results/history
                    cp -r gh-pages/${{ env.REPORT_DATE }}/history/* allure-results/history/ || echo "No history found - first run?"
                  else
                    echo "No gh-pages branch found - first run?"
                  fi

            - name: Install Java in container
              run: |
                  apt-get update
                  apt-get install -y openjdk-17-jdk
                  export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                  echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
                  echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

            - name: Install dependencies (reuse bundled browsers)
              run: |
                  npm ci
                  npm install -g allure-commandline

            - name: Capture job start time
              run: echo "job_started_at=$(TZ=\"Europe/Moscow\" date '+%d.%m.%Y %H:%M')" >> "$GITHUB_ENV"

            - name: Create Allure results directory
              run: mkdir -p allure-results

            - name: Set Allure environment and executor info
              run: |
                  mkdir -p allure-results

                  echo "{
                    \"Project\": \"Проверка сайтов\",
                    \"Environment\": \"Production\",
                    \"TestSuite\": \"Проверка доступности\",
                    \"CI\": \"GitHub Actions\",
                    \"OS\": \"${{ runner.os }}\",
                    \"Node.js\": \"$(node --version)\",
                    \"Playwright\": \"$(npx playwright --version)\",
                    \"Run ID\": \"${{ github.run_id }}\",
                    \"Commit\": \"${{ github.sha }}\"
                  }" > allure-results/environment.json

                  echo "{
                    \"name\": \"GitHub Actions\",
                    \"type\": \"github\",
                    \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                    \"buildOrder\": \"${{ github.run_id }}\",
                    \"buildName\": \"${{ github.workflow }} #${{ github.run_number }}\",
                    \"buildUrl\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                    \"reportUrl\": \"https://${{ github.repository_owner }}.github.io/${{ env.REPO_NAME }}/${{ env.REPORT_DATE }}/\",
                    \"reportName\": \"Allure Report\"
                  }" > allure-results/executor.json

            - name: Run tests
              continue-on-error: true
              run: |
                  set +e
                  grep_pattern="${{ github.event.inputs.grep }}"
                  [ -z "$grep_pattern" ] && grep_pattern="Проверка доступности сайтов"
                  echo "Using grep pattern: $grep_pattern"
                  npx playwright test --grep "$grep_pattern" --reporter=line,allure-playwright
                  tests_exit=$?
                  echo "tests_exit_code=$tests_exit" >> "$GITHUB_ENV"
                  exit $tests_exit

            - name: Summarize Allure results
              if: always()
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
                  import { join } from 'node:path';

                  const resultsDir = 'allure-results';
                  const counts = {
                    passed: 0,
                    failed: 0,
                    broken: 0,
                    skipped: 0,
                    unknown: 0,
                  };

                  let files = [];
                  try {
                    files = readdirSync(resultsDir).filter((file) => file.endsWith('-result.json'));
                  } catch {
                    files = [];
                  }

                  for (const file of files) {
                    try {
                      const result = JSON.parse(readFileSync(join(resultsDir, file), 'utf8'));
                      const status = typeof result.status === 'string' ? result.status : 'unknown';
                      counts[status] = (counts[status] ?? 0) + 1;
                    } catch {
                      counts.unknown += 1;
                    }
                  }

                  const total = Object.values(counts).reduce((sum, value) => sum + value, 0);
                  const lines = [
                    `ALLURE_TOTAL=${total}`,
                    `ALLURE_PASSED=${counts.passed}`,
                    `ALLURE_FAILED=${counts.failed}`,
                    `ALLURE_BROKEN=${counts.broken}`,
                    `ALLURE_SKIPPED=${counts.skipped}`,
                    `ALLURE_UNKNOWN=${counts.unknown}`,
                  ];

                  console.log('Allure summary:');
                  for (const line of lines) {
                    console.log(line);
                  }

                  appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);
                  writeFileSync('.allure-summary.env', `${lines.join('\n')}\n`);
                  NODE

                  . ./.allure-summary.env
                  if [ "${tests_exit_code:-0}" != "0" ] && [ "${ALLURE_TOTAL:-0}" = "0" ]; then
                    echo "::error::Playwright exited with code ${tests_exit_code}, but no Allure test results were found"
                    echo "job_exit_code=1" >> "$GITHUB_ENV"
                  fi

            - name: Generate Allure report with history
              id: generate_report
              if: always()
              run: |
                  REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ env.REPO_NAME }}/${{ env.REPORT_DATE }}/"
                  echo "REPORT_URL=${REPORT_URL}" >> "$GITHUB_ENV"
                  npx allure generate allure-results --clean -o allure-report \
                    --title "Отчёт по доступности сайтов" \
                    --report-url "$REPORT_URL" \
                    --history-folder allure-results/history

            - name: Copy history for gh-pages
              if: always()
              run: |
                  mkdir -p allure-report/history
                  cp -r allure-results/history/* allure-report/history/ || echo "No history to copy"

            - name: Verify report generation
              id: verify_report
              if: always()
              run: |
                  if [ ! -d "./allure-report" ]; then
                    echo "::error::Allure report generation failed!"
                    echo "job_exit_code=1" >> "$GITHUB_ENV"
                  fi

            - name: Clean up gh-pages - keep current and 7 previous
              if: always()
              run: |
                  if [ -d gh-pages ]; then
                    cd gh-pages || exit 1
                    echo "Before cleanup:"
                    find . -mindepth 1 -maxdepth 1

                    dated_dirs=""

                    for entry in *; do
                      if [ -d "$entry" ]; then
                        if echo "$entry" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$'; then
                          dated_dirs="$dated_dirs $entry"
                        else
                          echo "Deleting non-report folder: $entry"
                          rm -rf "$entry"
                        fi
                      else
                        echo "Deleting file: $entry"
                        rm -f "$entry"
                      fi
                    done

                    echo "$dated_dirs" | tr ' ' '\n' | grep -E '.' | sort -r | awk '
                      NR<=8 {printf "Keeping report folder %s\n", $0; next}
                      NR>8 {printf "Deleting report folder %s (older than last 8 runs)\n", $0; system("rm -rf \""$0"\"")}
                    '

                    echo "After cleanup:"
                    find . -mindepth 1 -maxdepth 1
                    cd ..
                  else
                    echo "gh-pages directory not found — nothing to clean"
                  fi

            - name: Save test status to report directory
              if: always()
              run: |
                  mkdir -p allure-report
                  echo "${{ env.tests_exit_code }}" > allure-report/status.txt
                  {
                    echo "total=${{ env.ALLURE_TOTAL }}"
                    echo "passed=${{ env.ALLURE_PASSED }}"
                    echo "failed=${{ env.ALLURE_FAILED }}"
                    echo "broken=${{ env.ALLURE_BROKEN }}"
                    echo "skipped=${{ env.ALLURE_SKIPPED }}"
                    echo "unknown=${{ env.ALLURE_UNKNOWN }}"
                  } > allure-report/summary.txt

            - name: Prepare GitHub Pages publish directory
              id: prepare_pages_publish
              if: always()
              run: |
                  rm -rf pages-publish
                  mkdir -p pages-publish

                  if [ -d gh-pages ]; then
                    cp -a gh-pages/. pages-publish/
                  fi

                  rm -rf "pages-publish/${{ env.REPORT_DATE }}"
                  mkdir -p "pages-publish/${{ env.REPORT_DATE }}"
                  cp -a allure-report/. "pages-publish/${{ env.REPORT_DATE }}/"

            - name: Deploy dated report to GitHub Pages
              id: deploy_report
              if: always()
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./pages-publish
                  user_name: github-actions
                  user_email: github-actions@github.com

            - name: Determine final status
              id: determine_status
              if: always()
              run: |
                  if [ "${{ env.job_exit_code }}" != "0" ] \
                    || [ "${{ steps.generate_report.outcome }}" = "failure" ] \
                    || [ "${{ steps.verify_report.outcome }}" = "failure" ] \
                    || [ "${{ steps.prepare_pages_publish.outcome }}" = "failure" ] \
                    || [ "${{ steps.deploy_report.outcome }}" = "failure" ]; then
                    {
                      echo "FINAL_STATUS=FAILED"
                      echo "FINAL_EMOJI=❌"
                      echo "FINAL_MESSAGE=Сбой job"
                    } >> "$GITHUB_ENV"
                  elif [ "${{ env.ALLURE_FAILED }}" != "0" ]; then
                    {
                      echo "FINAL_STATUS=FAILED"
                      echo "FINAL_EMOJI=❌"
                      echo "FINAL_MESSAGE=Есть failed-тесты"
                    } >> "$GITHUB_ENV"
                  elif [ "${{ env.ALLURE_BROKEN }}" != "0" ] || [ "${{ env.ALLURE_UNKNOWN }}" != "0" ]; then
                    {
                      echo "FINAL_STATUS=BROKEN"
                      echo "FINAL_EMOJI=⚠️"
                      echo "FINAL_MESSAGE=Есть broken-тесты"
                    } >> "$GITHUB_ENV"
                  else
                    {
                      echo "FINAL_STATUS=SUCCESS"
                      echo "FINAL_EMOJI=✅"
                      echo "FINAL_MESSAGE=Все прошло успешно"
                    } >> "$GITHUB_ENV"
                  fi

            - name: Prepare notification
              id: prepare_email
              if: always()
              run: |
                  {
                    echo "email_body<<EOF"
                    echo "Результат проверки сайтов: ${{ env.FINAL_EMOJI }} ${{ env.FINAL_MESSAGE }}"
                    echo "Время запуска: ${{ env.job_started_at }}"
                    echo "Время отправки письма: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
                    echo "Ссылка на отчёт: ${{ env.REPORT_URL }}"
                    echo ""
                    echo "Ссылки на последние отчёты:"
                    REPORT_ROOT="https://${{ github.repository_owner }}.github.io/${{ env.REPO_NAME }}"
                    count=0

                    # Try to list dated report folders from gh-pages worktree, newest first.
                    if [ -d gh-pages ]; then
                      cd gh-pages || true
                      dates=$(find . -mindepth 1 -maxdepth 1 -type d -name '20??-??-??' -printf '%f\n' | grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$' | sort -r || true)
                      if [ -n "$dates" ]; then
                        for d in $dates; do
                          if [ "$d" = "${{ env.REPORT_DATE }}" ]; then
                            continue
                          fi
                          echo "- $REPORT_ROOT/$d/"
                          count=$((count+1))
                          if [ "$count" -ge 7 ]; then
                            break
                          fi
                        done
                      fi
                      cd .. || true
                    fi

                    if [ ! -d gh-pages ] || [ "$count" = "0" ]; then
                      echo "(История недоступна — нет ветки gh-pages)"
                      for i in $(seq 1 7); do
                        d=$(date -d "${i} days ago" +%Y-%m-%d 2>/dev/null || date "-v-${i}d" +%Y-%m-%d 2>/dev/null || echo "")
                        if [ -n "$d" ]; then
                          echo "- $REPORT_ROOT/$d/"
                        fi
                      done
                    fi

                    echo ""
                    echo "Статусы Allure:"
                    echo "- Всего: ${{ env.ALLURE_TOTAL }}"
                    echo "- Passed: ${{ env.ALLURE_PASSED }}"
                    echo "- Failed: ${{ env.ALLURE_FAILED }}"
                    echo "- Broken: ${{ env.ALLURE_BROKEN }}"
                    echo "- Skipped: ${{ env.ALLURE_SKIPPED }}"
                    echo "- Unknown: ${{ env.ALLURE_UNKNOWN }}"
                    echo ""
                    echo "Коды выхода:"
                    echo "- Тесты: ${{ env.tests_exit_code }}"
                    echo "- Job: ${{ env.job_exit_code }}"
                    if [ "${{ env.ALLURE_FAILED }}" != "0" ]; then
                      echo ""
                      echo "❌ Есть failed-тесты"
                    fi
                    if [ "${{ env.ALLURE_BROKEN }}" != "0" ] || [ "${{ env.ALLURE_UNKNOWN }}" != "0" ]; then
                      echo ""
                      echo "⚠️ Есть broken/unknown-тесты"
                    fi
                    if [ "${{ env.job_exit_code }}" != "0" ]; then
                      echo ""
                      echo "⚠️ Job завершился с ошибкой"
                    fi
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Send email notification
              if: always()
              uses: dawidd6/action-send-mail@v3
              with:
                  server_address: smtp.yandex.ru
                  server_port: 587
                  username: ${{ secrets.EMAIL_USERNAME }}
                  password: ${{ secrets.EMAIL_PASSWORD }}
                  subject: 'Проверка сайтов - ${{ env.FINAL_EMOJI }} ${{ env.FINAL_STATUS }} (run_id:${{ github.run_id }})'
                  body: ${{ steps.prepare_email.outputs.email_body }}
                  to: ${{ secrets.EMAIL_RECIPIENTS }}
                  from: 'Проверка доступности сайтов'

            - name: Set job conclusion
              if: always()
              run: |
                  if [ "${{ env.FINAL_STATUS }}" = "FAILED" ]; then
                    echo "conclusion=failure" >> "$GITHUB_OUTPUT"
                    exit 1
                  else
                    echo "conclusion=success" >> "$GITHUB_OUTPUT"
                  fi
